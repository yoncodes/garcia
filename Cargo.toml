[workspace]
members = [
    "common",
    "configs",
    "protocol",
    "database",
    "logic",
    "gameserver",
    "sdkserver",
    "hotpatchserver",
    "muipserver",
    "packetcapture",

]

resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
ansi_term = "0.12.1"
anyhow = "1.0.103"
axum = "0.8.4"
fastrand = "2.5.0"
prost = "0.14.4"
prost-build = "0.14.4"
protoc-bin-vendored = "3.2.0"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "migrate"] }
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
thiserror = "2"
toml = "0.9"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

protocol = { path = "protocol" }
common = { path = "common" }
database = { path = "database" }
configs = { path = "configs" }
logic = { path = "logic" }
muipserver = { path = "muipserver" }
